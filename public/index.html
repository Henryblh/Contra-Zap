<!-- NOVO: Script para mapear o mouse para o SVG -->
<!-- NOVO: Script para incrementar o progresso com o movimento do mouse -->
<script>
    const barra = document.getElementById('barra-mouse');
    const larguraSVG = 1200;

    // Variáveis para guardar nosso progresso e a última posição do mouse
    let progressoTotal = 0;
    let ultimoX = null;
    let ultimoY = null;

    // Fator de velocidade do preenchimento.
    // Aumente para encher mais rápido, diminua para encher mais devagar.
    const sensibilidade = 0.3;

    document.addEventListener('mousemove', (event) => {
        // Se for o primeiro movimento, apenas gravamos a posição inicial e saímos
        if (ultimoX === null || ultimoY === null) {
            ultimoX = event.clientX;
            ultimoY = event.clientY;
            return;
        }

        // Calcula quantos pixels o mouse moveu desde a última vez
        const deltaX = event.clientX - ultimoX;
        const deltaY = event.clientY - ultimoY;

        // Teorema de Pitágoras para saber a distância real percorrida
        const distanciaPercorrida = Math.sqrt((deltaX * deltaX) + (deltaY * deltaY));

        // Atualiza a última posição para o próximo cálculo
        ultimoX = event.clientX;
        ultimoY = event.clientY;

        // Soma a distância ao nosso contador de progresso
        progressoTotal += (distanciaPercorrida * sensibilidade);

        // Garante que a barra não passe do limite de 1200 do SVG
        if (progressoTotal > larguraSVG) {
            progressoTotal = larguraSVG;
            // Aqui você poderia adicionar alguma função para quando chegar em 100%
        }

        // Aplica a nova largura no retângulo do clipPath
        barra.setAttribute('width', progressoTotal);
    });
</script>
